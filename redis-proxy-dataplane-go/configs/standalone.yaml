server:
  listen: "0.0.0.0:6379"

admin:
  listen: "0.0.0.0:8080"

mode: "standalone"

backends:
  clusters:
    - name: "redis-a"
      nodes:
        - "127.0.0.1:63790"
      pool:
        connectionsPerNode: 16
        maxInflightPerConnection: 4096

routing:
  defaultCluster: "redis-a"
  routeEpoch: 1

controlPlane:
  enabled: false
  url: "http://127.0.0.1:8090/api/v1/config"
  pollIntervalSeconds: 5
  watchTimeoutSeconds: 30
  requestTimeoutMillis: 1000

limits:
  maxPipelineDepth: 1024
  maxRequestBytes: 10485760
  maxResponseBytes: 104857600
  largeResponseBytes: 1048576

analysis:
  hotKey:
    enabled: true
    windowSeconds: 60
    bucketMillis: 1000
    maxTrackedKeys: 10000
    metricsTopN: 20
  largeKey:
    enabled: true
    requestBytesThreshold: 1048576
    responseBytesThreshold: 1048576
    windowSeconds: 300
    bucketMillis: 1000
    maxTrackedKeys: 10000
    debugTopN: 100
  slowQuery:
    enabled: true
    endToEndThresholdMillis: 100
    backendThresholdMillis: 50
    windowSeconds: 300
    bucketMillis: 1000
    maxTrackedKeys: 10000
    debugTopN: 100
