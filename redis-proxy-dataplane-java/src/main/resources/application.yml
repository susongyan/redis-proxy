server:
  port: 8080
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true

proxy:
  server:
    listen: "0.0.0.0:6379"
    bossThreads: 1
    workerThreads: 0
  admin:
    listen: "0.0.0.0:8080"
  mode: "cluster"
  backends:
    clusters:
      - name: "redis-a"
        nodes:
          - "127.0.0.1:7000"
          - "127.0.0.1:7001"
          - "127.0.0.1:7002"
        pool:
          connectionsPerNode: 16
          maxInflightPerConnection: 1024
  routing:
    defaultCluster: "redis-a"
    routeEpoch: 1
    backendAffinityStrategy: "client"
  controlPlane:
    enabled: false
    url: "http://127.0.0.1:8090/api/v1/config"
    pollIntervalSeconds: 5
    watchTimeoutSeconds: 30
    requestTimeoutMillis: 1000
  limits:
    maxPipelineDepth: 1024
    pipelineFlushBatchSize: 16
    pipelineFlushMaxDelayMillis: 1
    maxRequestBytes: 10485760
    maxResponseBytes: 104857600
    largeResponseBytes: 1048576
  analysis:
    hotKey:
      enabled: true
      windowSeconds: 60
      bucketMillis: 1000
      maxTrackedKeys: 10000
      metricsTopN: 20
    largeKey:
      enabled: true
      requestBytesThreshold: 1048576
      responseBytesThreshold: 1048576
      windowSeconds: 300
      bucketMillis: 1000
      maxTrackedKeys: 10000
      debugTopN: 100
